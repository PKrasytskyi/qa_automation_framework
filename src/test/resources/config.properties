baseUrl=https://the-internet.herokuapp.com/
browser=chrome
headless=true
explicit.wait=10
page.load.timeout=30
testdata.excel.path=src/test/resources/testdata/TestData.xlsx
testdata.json.path=src/test/resources/testdata/TestData.json
reportPath=reports/
screenshotPath=reports/screenshots/
maxStackTraceChars=8000
maxPageSourceChars=12000
environment=qa
# OpenAI agent
# Prefer OPENAI_API_KEY environment variable over storing secrets in this file.
# openai.api.key=
openai.model=gpt-4.1
agent.enabled=false
agent.mode=off
agent.timeout.seconds=30
