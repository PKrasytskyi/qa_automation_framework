name: ui-api-tests

x-test-runner: &ui-test-runner
  build:
    context: .
  image: ui-api-tests:local

  depends_on:
    selenium:
      condition: service_healthy

  environment:
    EXECUTE_MODE: REMOTE
    SELENIUM_REMOTE_URL: http://selenium:4444
    BASE_URL: https://the-internet.herokuapp.com/
    HEADLESS: "true"



services:
  selenium:
    image: selenium/standalone-chrome:4.35.0
    shm_size: 2gb

    environment:
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:4444/status
      interval: 5s
      timeout: 30s
      retries: 20

  ui:
    <<: *ui-test-runner
    command: ui
    volumes:
      - ./target:/workspace/target

  ui-parallel:
    <<: *ui-test-runner
    command: ui-parallel
    volumes:
      - ./target:/workspace/target

  smoke:
    <<: *ui-test-runner
    command: smoke
    volumes:
      - ./target:/workspace/target

  smoke-parallel:
    <<: *ui-test-runner
    command: smoke-parallel
    volumes:
      - ./target:/workspace/target

  api:
    build:
      context: .
    image: ui-api-tests:local
    command: api
    volumes:
      - ./target:/workspace/target

  api-auth:
    build:
      context: .
    image: ui-api-tests:local
    command: api-auth
    environment:
      HEADLESS: "true"
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - ./target:/workspace/target